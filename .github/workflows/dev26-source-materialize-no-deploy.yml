name: DEV26 one-time source materialization (NO DEPLOY)
on:
  push:
    branches:
      - dev/dev26-final-source-freeze-20261112

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      CF_PAGES_BRANCH: release/dev26-cloud-build-20261112
    steps:
      - name: Checkout the audited QA base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Guard base, target, and one-shot trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'dev/dev26-final-source-freeze-20261112'
          git merge-base --is-ancestor 8961f8fbf697fcdf5c1c9ce70734f48af11d2354 HEAD
          if git ls-remote --exit-code --heads origin 'refs/heads/dev/dev26-final-integrated-source-20261112'; then
            echo 'Refusing to overwrite an existing integrated branch' >&2
            exit 51
          fi
          test -f .release/DEV26_BACKGROUND_FONT_REPAIR.patch
      - name: Use the same pinned Node version as passing DEV26 QA
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Apply all eight pinned patches and validate cumulative code (NO DEPLOY)
        shell: bash
        run: bash .release/build-dev26-cloudflare.sh
      - name: Commit verified, real source files to a separate development branch only
        shell: bash
        run: |
          set -euo pipefail
          target='dev/dev26-final-integrated-source-20261112'
          git switch -c "$target"
          git add -A -- .gitattributes browser-local/index.html browser-local/package.json browser-local/src browser-local/tests browser-local/scripts src/admin/handler.js src/trace-dev4-runtime.js
          # Git binary fixtures belong in the integrated source tree too.
          git add -f -- browser-local/tests/fixtures/descriptor.xlsx \
            browser-local/tests/fixtures/jpeg-exif-rotate-6.jpg \
            browser-local/tests/fixtures/jpeg-rgb-800x400.jpg \
            browser-local/tests/fixtures/non-office.zip \
            browser-local/tests/fixtures/r66-validated.pdf \
            browser-local/tests/fixtures/r66-xref-stream.pdf \
            browser-local/tests/fixtures/small-deflated.xlsx \
            browser-local/tests/fixtures/small-real-zip.xlsx \
            browser-local/tests/fixtures/xlsx-canonical.xlsx
          git diff --cached --check
          count="$(git diff --cached --name-only | wc -l)"
          test "$count" -ge 40
          mkdir -p docs
          cat > docs/DEV26_FINAL_INTEGRATED_SOURCE.md <<'EOF'
          # DEV26 final integrated source — development only
          
          Original source: R65 main `2a11edbdb3d1413b3ef4a6eccb150dd442c2f7cf`.
          Audited QA parent: `8961f8fbf697fcdf5c1c9ce70734f48af11d2354`.
          Cumulative code: eight pinned `.release/*.patch` applied sequentially by
          `.release/build-dev26-cloudflare.sh`, including binary fixtures.
          
          This branch commits the resulting actual browser/source files. For
          subsequent validation of this branch use `npm run build`, not the
          legacy patch-applying builder (it must not run twice). Production
          deployment, merging main, and admin/D1 mutation are NOT part of
          this source-integration action.
          
          Previous real Chromium QA on audited parent:
          https://github.com/Peter-msk/Sunrise-PDF-Pro-web/actions/runs/43181829604
          
          Known open acceptance gates: Windows Chrome/Edge real installed
          fonts, suspended/minimized browser limits, genuine complex HWP/HWPX
          fidelity against Hancom PDF, admin document-open failures, and
          administrator authenticated E2E. PPT/PPTX remains unsupported.
          EOF
          git add docs/DEV26_FINAL_INTEGRATED_SOURCE.md
          git diff --cached --check
          git config user.name 'Sunrise DEV26 Source Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(DEV26): materialize verified patches into final development source'
          git push origin "HEAD:refs/heads/$target"
          printf '%s\n' 'SOURCE_INTEGRATION_BRANCH_CREATED_NO_DEPLOY'
