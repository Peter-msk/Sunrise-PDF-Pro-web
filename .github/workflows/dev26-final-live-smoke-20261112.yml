name: DEV26 FINAL post-deploy live acceptance (read-only/public fixtures)
on:
  push:
    branches: [dev/dev26-final-integrated-source-20261112]
    paths:
      - .github/workflows/dev26-final-live-smoke-20261112.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      SUNRISE_TEST_URL: https://sunrise-pdf-pro-web.ko-pg.workers.dev/local/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Verify live production health, local converter UI and PDF worker assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sunrise-pdf-pro-web.ko-pg.workers.dev'
          curl -fLSs --retry 4 --retry-delay 2 --max-time 40 "$BASE/local/health" -o /tmp/dev26-prod-health.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/dev26-prod-health.json','utf8'));if(x.rhwp_version!=='0.8.7'||x.wasm_sha256!=='54cf95014312e605c51b98eb9021247ea79ef2bbd0a7080e11c011d0246e3989'||x.wasm_bytes!==11821756||x.document_upload!==false)process.exit(2);console.log('DEV26_LIVE_HEALTH_PRIVACY_PASS')"
          curl -fLSs --retry 4 --retry-delay 2 "$BASE/local/" -o /tmp/dev26-live.html
          grep -Fq 'value="professional" selected' /tmp/dev26-live.html
          grep -Fq 'value="hybrid-filter"' /tmp/dev26-live.html
          grep -Fq 'value="compat-raster"' /tmp/dev26-live.html
          curl -fLIs --retry 4 "$BASE/local/rhwp_bg.wasm" -o /tmp/dev26-live-wasm.headers
          grep -qi '^content-type: application/wasm' /tmp/dev26-live-wasm.headers
          curl -fLIs --retry 4 "$BASE/local/pdf-worker-legacy.mjs" -o /tmp/dev26-live-quality-worker.headers
          grep -qi '^content-type: application/javascript' /tmp/dev26-live-quality-worker.headers
          curl -fLIs --retry 4 "$BASE/local/pdf-worker.mjs" -o /tmp/dev26-live-preview-worker.headers
          grep -qi '^content-type: application/javascript' /tmp/dev26-live-preview-worker.headers
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/local/pdf-worker-legacy.mjs")
          test "$code" = '405'
          echo 'DEV26_LIVE_ASSETS_AND_SECURITY_PASS'
      - name: Install pinned local browser dependencies
        run: npm --prefix browser-local ci --no-audit --no-fund --ignore-scripts
      - name: Install local Chromium engine
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Pinned public HWP/HWPX samples (no customer documents)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r29-browser-fixtures
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/re-01-hangul-only-hancom.hwp' -o r29-browser-fixtures/genuine.hwp
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/tac-host-spacing.hwpx' -o r29-browser-fixtures/genuine.hwpx
      - name: Actual production Chromium HWP/HWPX PDFs, ZIP, font and vector auditing
        shell: bash
        run: |
          set -euo pipefail
          node browser-local/tests/r66-production-live-dom-smoke.mjs
          echo 'DEV26_FINAL_LIVE_BROWSER_ACCEPTANCE_PASS'
