name: DEV28 missing glyph opt-in PDF real HWP and XLSX error classification (NO DEPLOY)
on:
  push:
    branches:
      - fix/dev28-live-conversion-errors-20261114
    paths:
      - .github/workflows/dev28-font-recovery-targeted.yml
permissions:
  contents: read
concurrency:
  group: dev28-font-recovery-targeted
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Install locked dependencies, no scripts
        run: npm ci --prefix browser-local --ignore-scripts --no-audit --no-fund
      - name: Syntax of modified code and tests
        run: |
          node --check browser-local/src/main.js
          node --check browser-local/src/spreadsheet-pdf.js
          node --check browser-local/src/pro-telemetry.js
          node --check browser-local/src/conversion-recovery.mjs
          node --check browser-local/tests/dev28-live-error-policy.mjs
          node --check browser-local/tests/dev28-font-recovery-browser.mjs
      - name: Error-code, opt-in, ZIP safety and existing queue recovery
        run: node --test browser-local/tests/dev28-live-error-policy.mjs browser-local/tests/r66-real-failure-retry.mjs browser-local/tests/r67-bulk-recovery.mjs browser-local/tests/r66-xlsx-package-guard.mjs browser-local/tests/r66-xlsx-structure-extra.mjs
      - name: Install actual Chromium
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Fetch only version-pinned public real HWP file
        run: |
          set -euo pipefail
          mkdir -p r29-browser-fixtures
          curl -fLSs --retry 3 --max-time 40 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/basic/issue2007_nested_cell_pagination_42065.hwp' -o r29-browser-fixtures/complex.hwp
      - name: Start isolated Vite dev server
        run: |
          set -euo pipefail
          npm --prefix browser-local run dev -- --port 4174 >/tmp/dev28-raster-qa.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev28-raster-qa.log
          exit 1
      - name: Actual 17-page font error to PDF via user-selected image recovery
        env:
          SUNRISE_DEV28_URL: http://127.0.0.1:4174/
        run: node browser-local/tests/dev28-font-recovery-browser.mjs
