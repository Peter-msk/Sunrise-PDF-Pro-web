name: DEV26 PDF stream lifecycle root-cause QA (NO DEPLOY)
on:
  push:
    branches:
      - dev/dev26-final-integrated-source-20261112
    paths:
      - .github/workflows/dev26-pdf-stream-root-targeted-no-deploy.yml
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Install pinned dependencies
        run: npm --prefix browser-local ci --no-audit --no-fund --ignore-scripts
      - name: Stream stalled-event distinctions, release, PDF integrity and recovery
        run: |
          set -euo pipefail
          node --test browser-local/tests/r66-pdf-stream-diagnostics.mjs browser-local/tests/r66-pdf-early-stream.mjs browser-local/tests/r66-pdf-stream-progress.mjs browser-local/tests/r66-pdf-output-integrity.mjs browser-local/tests/r66-pdf-writer-disposal.mjs browser-local/tests/r65-last-page-stall.mjs browser-local/tests/r66-real-failure-retry.mjs browser-local/tests/r66-hybrid-vector-integration.mjs browser-local/tests/pdfkit-real-library.mjs
      - name: Browser build and Worker static assets without deployment
        run: |
          set -euo pipefail
          npm --prefix browser-local run check:source
          npm --prefix browser-local run build
          npm --prefix browser-local run verify:dist
          node scripts/verify-browser-build.mjs
          node scripts/test-worker-assets.mjs
      - name: Chromium for real HWP/HWPX vector stream acceptance
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Fetch pinned public HWP/HWPX samples (never user documents)
        run: |
          set -euo pipefail
          mkdir -p r29-browser-fixtures
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/re-01-hangul-only-hancom.hwp' -o r29-browser-fixtures/genuine.hwp
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/tac-host-spacing.hwpx' -o r29-browser-fixtures/genuine.hwpx
      - name: Local-only Cloudflare Worker with telemetry endpoint (NO DEPLOY)
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 >/tmp/dev26-pdf-stream-worker.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/local/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev26-pdf-stream-worker.log
          exit 1
      - name: Real Chromium HWP/HWPX individual PDF plus ZIP E2E
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/e2e.mjs
      - name: No deployment performed
        run: echo DEV26_PDF_STREAM_ROOT_DIAGNOSTICS_NO_DEPLOY_PASS
