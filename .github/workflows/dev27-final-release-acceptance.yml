name: DEV27 final release acceptance (NO DEPLOY)
# Rerun: updated obsolete global-engine font permission assertion for DEV27 per-item recovery.
on:
  push:
    branches:
      - dev/dev27-p0-baseline-audit-20261113
    paths:
      - .github/workflows/dev27-final-release-acceptance.yml
permissions:
  contents: read
concurrency:
  group: dev27-final-acceptance
  cancel-in-progress: true
jobs:
  all-tests-build-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Full pinned tests, actual build, verified WASM and Worker assets
        run: npm run build
      - name: Source contract after build
        run: npm --prefix browser-local run check:source
      - name: Wrangler v4 dry-run without production mutation
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/sunrise-dev27-final-dry-run
      - name: Chromium for actual HWP and HWPX browser PDF E2E
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Fetch pinned public one-page and complex documents
        run: |
          set -euo pipefail
          mkdir -p r29-browser-fixtures
          curl -fLSs --retry 3 --max-time 30 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/re-01-hangul-only-hancom.hwp' -o r29-browser-fixtures/genuine.hwp
          curl -fLSs --retry 3 --max-time 30 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/tac-host-spacing.hwpx' -o r29-browser-fixtures/genuine.hwpx
          curl -fLSs --retry 3 --max-time 30 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/basic/issue2007_nested_cell_pagination_42065.hwp' -o r29-browser-fixtures/complex.hwp
          curl -fLSs --retry 3 --max-time 30 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/SO-SUEOP.hwpx' -o r29-browser-fixtures/complex.hwpx
      - name: Start isolated local Wrangler Worker with built assets
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 >/tmp/dev27-final-worker.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS 'http://127.0.0.1:8787/local/health' > /tmp/dev27-final-health.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev27-final-worker.log
          exit 1
      - name: Public real HWP HWPX professional PDF download and ZIP
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/e2e.mjs
      - name: Explicit filter-only hybrid HWP HWPX browser PDF
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/hybrid-real-browser.mjs
      - name: Existing native SVG print recovery browser UI against built Worker
        env:
          SUNRISE_RECOVERY_UI_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/dev27-native-print-real-browser.mjs
      - name: Complex public 17-page HWP and 46-page HWPX real print PDF path
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
          DEV27_PUBLIC_FIXTURE_SET: complex
        run: node browser-local/tests/dev27-print-pdf-parity-public.mjs
      - name: Preserve only public fixture structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev27-final-acceptance-evidence
          path: |
            /tmp/dev27-final-health.json
            r29-browser-real-evidence/DEV27_PRINT_PDF_PARITY_PUBLIC_complex.json
            r29-browser-real-evidence/DEV27_NATIVE_PRINT_REAL_BROWSER.json
            r29-browser-real-evidence/R40_BROWSER_LOCAL_E2E.json
            r29-browser-real-evidence/DEV26_HYBRID_BROWSER_E2E.json
          if-no-files-found: warn
          retention-days: 10
