name: DEV26 recurrence recovery production smoke (read-only)
on:
  push:
    branches:
      - release/dev26-cloud-build-20261112
    paths:
      - .github/workflows/dev26-recovery-prod-smoke.yml
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify released browser code, health endpoint and WASM
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sunrise-pdf-pro-web.ko-pg.workers.dev'
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$BASE/local/health" -o /tmp/health.json
          node -e 'const x=require("/tmp/health.json");if(x.rhwp_version!=="0.8.7"||x.wasm_sha256!=="54cf95014312e605c51b98eb9021247ea79ef2bbd0a7080e11c011d0246e3989") process.exit(1);console.log("RELEASE_HEALTH_PASS");'
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$BASE/local/" -o /tmp/index.html
          grep -Fq 'compat-raster' /tmp/index.html
          echo 'RELEASE_HTML_PASS'
          curl --fail --silent --show-error --location --retry 2 --max-time 20 "$BASE/assets/local-bundle.js" -o /tmp/local-bundle.js
          grep -Fq 'compat-retry' /tmp/local-bundle.js
          grep -Fq '이 파일만 이미지 PDF로 복구' /tmp/local-bundle.js
          grep -Fq 'SVG_FILTER_EFFECT_UNSUPPORTED' /tmp/local-bundle.js
          grep -Fq 'PDF_STREAM_TIMEOUT' /tmp/local-bundle.js
          echo 'RELEASE_PER_FILE_RECOVERY_CODE_PASS'
          curl --fail --silent --show-error --location --head --retry 2 --max-time 20 "$BASE/local/rhwp_bg.wasm" -o /tmp/wasm.headers
          grep -qi '^content-type: application/wasm' /tmp/wasm.headers
          echo 'RELEASE_WASM_PASS'
