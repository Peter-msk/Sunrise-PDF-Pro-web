name: Build symbol font candidate
on:
  pull_request:
    paths:
      - '.github/workflows/local-font-subset.yml'
permissions:
  contents: read
jobs:
  subset:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools==4.60.1
      - name: Fetch official font and license
        run: |
          mkdir -p fontcandidate
          curl -fL --retry 3 'https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf' -o fontcandidate/original.otf
          curl -fL --retry 3 'https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/LICENSE' -o fontcandidate/LICENSE.txt
          sha256sum fontcandidate/original.otf > fontcandidate/source.sha256
      - name: Create symbol subset
        run: |
          pyftsubset fontcandidate/original.otf --unicodes='U+0370-03FF,U+2000-206F,U+2100-22FF,U+2460-24FF,U+3000-303F,U+3200-33FF,U+FF00-FFEF' --layout-features='*' --no-hinting --output-file=fontcandidate/SunriseSymbols.otf
          rm fontcandidate/original.otf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symbol-font-candidate
          path: fontcandidate
          retention-days: 1
