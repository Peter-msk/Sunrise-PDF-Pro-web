name: DEV26 SVG complex table and vector PDF QA (NO DEPLOY)
# final text-extraction acceptance: PDF.js page content proof in addition to drawing commands
on:
  push:
    branches:
      - dev/dev26-final-integrated-source-20261112
    paths:
      - .github/workflows/dev26-vector-quality-targeted-no-deploy.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - run: npm --prefix browser-local ci --no-audit --no-fund --ignore-scripts
      - name: Real PDFKit PDF.js mixed vector table diagram and SVG filter QA
        run: |
          set -euo pipefail
          node --test browser-local/tests/r66-complex-vector-quality.mjs browser-local/tests/r66-hybrid-vector-integration.mjs browser-local/tests/r66-hybrid-svg-filter.mjs browser-local/tests/r66-svg-filter-vector-safe.mjs browser-local/tests/r66-pdf-output-integrity.mjs browser-local/tests/r66-pdf-font-embedding-audit.mjs
      - name: Check source, Vite WASM bundle and local Worker contract
        run: |
          set -euo pipefail
          npm --prefix browser-local run check:source
          npm --prefix browser-local run build
          npm --prefix browser-local run verify:dist
          node scripts/verify-browser-build.mjs
          node scripts/test-worker-assets.mjs
      - name: Install isolated Chromium only
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Pinned public HWP HWPX, never user document
        run: |
          set -euo pipefail
          mkdir -p r29-browser-fixtures
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/re-01-hangul-only-hancom.hwp' -o r29-browser-fixtures/genuine.hwp
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/tac-host-spacing.hwpx' -o r29-browser-fixtures/genuine.hwpx
      - name: Serve only isolated local Worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 >/tmp/dev26-vector-quality-worker.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/local/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev26-vector-quality-worker.log
          exit 1
      - name: Chromium actual HWP/HWPX professional PDF + ZIP
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/e2e.mjs
      - name: Chromium user-clicked vector quality report
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/r66-vector-quality-browser.mjs
      - name: No deployment performed
        run: echo DEV26_COMPLEX_SVG_VECTOR_QUALITY_QA_PASS_NO_DEPLOY
