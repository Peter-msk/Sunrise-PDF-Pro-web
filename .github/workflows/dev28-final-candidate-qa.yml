name: DEV28 final observed-conversion-errors candidate QA (NO DEPLOY)
# Final candidate includes distinct package/parse/layout error stages; no production deployment.
on:
  push:
    branches:
      - fix/dev28-live-conversion-errors-20261114
    paths:
      - .github/workflows/dev28-final-candidate-qa.yml
permissions:
  contents: read
concurrency:
  group: dev28-final-candidate-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Syntax and lockfile-based full regressions, Vite dist, Worker assets, WASM pin
        run: |
          node --check browser-local/src/conversion-recovery.mjs
          node --check browser-local/src/pro-telemetry.js
          node --check browser-local/src/main.js
          node --check browser-local/src/spreadsheet-pdf.js
          node --check src/admin/handler.js
          npm run build
      - name: DEV28 real failure code classification and consent only recovery
        run: node --test browser-local/tests/dev28-live-error-policy.mjs
      - name: Production Worker bundle syntax without deployment
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/dev28-worker-bundle-check
      - name: Chromium
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Download one public complex HWP; synthetic spreadsheet generated by test
        run: |
          set -euo pipefail
          mkdir -p r29-browser-fixtures
          curl -fLSs --retry 3 --max-time 40 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/basic/issue2007_nested_cell_pagination_42065.hwp' -o r29-browser-fixtures/complex.hwp
      - name: Start isolated Cloudflare Worker with actual build assets
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 >/tmp/dev28-local-worker.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/local/health > /tmp/dev28-health.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev28-local-worker.log
          exit 1
      - name: Actual local Worker synthetic XLSX to PDF with exact error stage instrumentation
        env:
          SUNRISE_XLSX_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/dev28-live-xlsx-smoke.mjs
      - name: Actual local Worker 17-page missing-glyph HWP to user-clicked image PDF
        env:
          SUNRISE_DEV28_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/dev28-font-recovery-browser.mjs
      - name: Save only non-identifying health/status; no document bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev28-candidate-qa-health
          path: /tmp/dev28-health.json
          if-no-files-found: warn
          retention-days: 5
