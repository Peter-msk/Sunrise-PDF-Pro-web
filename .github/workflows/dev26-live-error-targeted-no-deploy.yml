name: DEV26 today's live-error targeted QA (NO DEPLOY)
on:
  push:
    branches:
      - dev/dev26-final-integrated-source-20261112
    paths:
      - .github/workflows/dev26-live-error-targeted-no-deploy.yml
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout integrated development source (no deployment)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Node 24 and locked dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Install only pinned development dependencies
        run: npm --prefix browser-local ci --no-audit --no-fund --ignore-scripts
      - name: Targeted regressions for real failures and browser background/font changes
        run: |
          set -euo pipefail
          node --test browser-local/tests/r66-real-failure-retry.mjs browser-local/tests/r66-real-failure-compat.mjs browser-local/tests/r66-background-font.mjs browser-local/tests/r66-hybrid-svg-filter.mjs browser-local/tests/r66-hybrid-vector-integration.mjs browser-local/tests/r66-pdf-stream-progress.mjs browser-local/tests/r66-pdf-writer-disposal.mjs
      - name: Browser bundle and WASM contract build (no deploy)
        run: |
          set -euo pipefail
          npm --prefix browser-local run check:source
          npm --prefix browser-local run build
          npm --prefix browser-local run verify:dist
          node scripts/verify-browser-build.mjs
          node scripts/test-worker-assets.mjs
      - name: Install Chromium for deterministic UI recovery test
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Start local-only Vite for recovery browser
        shell: bash
        run: |
          set -euo pipefail
          (cd browser-local && node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4174 --strictPort > /tmp/dev26-targeted-vite.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev26-targeted-vite.log
          exit 1
      - name: Chromium exact filter-hybrid and stream-compat retry contract
        env:
          SUNRISE_RECOVERY_UI_URL: http://127.0.0.1:4174/
        run: node browser-local/tests/recovery-browser.mjs
      - name: All checks passed without any external deployment
        run: echo 'DEV26_TARGETED_REAL_ERROR_FIX_QA_PASS_NO_DEPLOY'
