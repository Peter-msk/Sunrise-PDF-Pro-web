name: DEV26 recurrent production failure recovery QA (NO DEPLOY)
on:
  push:
    branches:
      - fix/dev26-recurrent-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: 'true'
      CF_PAGES_BRANCH: release/dev26-cloud-build-20261112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Verify cumulative patch chain, run complete tests and build
        run: bash .release/build-dev26-cloudflare.sh
      - name: Verify one-click recovery contract independently
        run: |
          set -euo pipefail
          node --test browser-local/tests/r66-real-failure-retry.mjs
          grep -q '이 파일만 이미지 PDF로 복구' browser-local/dist/assets/local-bundle.js || grep -q 'compat-retry' browser-local/dist/assets/local-bundle.js
          test -s browser-local/dist/rhwp_bg.wasm
      - name: Install Chromium
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Fetch published genuine HWP/HWPX fixtures
        run: |
          mkdir -p r29-browser-fixtures
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/re-01-hangul-only-hancom.hwp' -o r29-browser-fixtures/genuine.hwp
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/tac-host-spacing.hwpx' -o r29-browser-fixtures/genuine.hwpx
      - name: Start isolated Worker for original HWP/HWPX conversion
        run: |
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 >/tmp/dev26-recovery-worker.log 2>&1 &
          for n in $(seq 1 90); do
            if curl -fsS 'http://127.0.0.1:8787/local/health' >/tmp/dev26-recovery-health.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev26-recovery-worker.log;exit 1
      - name: Actual Chromium HWP/HWPX default vector conversion
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/e2e.mjs
      - name: Actual Chromium HWP/HWPX explicit image compatibility conversion
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/compat-real-browser.mjs
      - name: Start isolated Vite UI for deterministic production-error reproduction
        run: |
          npm --prefix browser-local run dev -- --port 4174 >/tmp/dev26-recovery-vite.log 2>&1 &
          for n in $(seq 1 70); do
            if curl -fsS 'http://127.0.0.1:4174/' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev26-recovery-vite.log;exit 1
      - name: Actual UI error, one-file consent, retry and PDF completion
        env:
          SUNRISE_RECOVERY_UI_URL: http://127.0.0.1:4174/
        run: node browser-local/tests/recovery-browser.mjs
      - name: Save browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev26-recurrent-failure-recovery-qa
          path: |
            r29-browser-real-evidence/DEV26_COMPAT_BROWSER_E2E.json
            r29-browser-real-evidence/R40_BROWSER_LOCAL_E2E.json
            /tmp/dev26-recovery-health.json
            /tmp/dev26-recovery-worker.log
            /tmp/dev26-recovery-vite.log
          if-no-files-found: warn
          retention-days: 7
