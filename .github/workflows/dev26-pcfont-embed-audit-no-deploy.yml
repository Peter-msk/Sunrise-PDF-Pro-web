name: DEV26 PC font PDF embedding audit QA (NO DEPLOY)
# rerun: pinpoint bilingual local-font selection regression
on:
  push:
    branches:
      - dev/dev26-final-integrated-source-20261112
    paths:
      - .github/workflows/dev26-pcfont-embed-audit-no-deploy.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Install pinned deps with no scripts
        run: npm --prefix browser-local ci --no-audit --no-fund --ignore-scripts
      - name: Actual Korean PDF font embedded program + local/TTC/style regressions
        run: |
          set -euo pipefail
          node --test browser-local/tests/r66-pdf-font-embedding-audit.mjs browser-local/tests/r66-local-font-fidelity.mjs browser-local/tests/r66-background-font.mjs browser-local/tests/r66-font-run-fidelity.mjs browser-local/tests/r66-font-layout-guard.mjs
          node --test browser-local/tests/r66-ttc-real.mjs
      - name: Vite/WASM bundle and Worker contract tests (no deploy)
        run: |
          set -euo pipefail
          npm --prefix browser-local run check:source
          npm --prefix browser-local run build
          npm --prefix browser-local run verify:dist
          node scripts/verify-browser-build.mjs
          node scripts/test-worker-assets.mjs
      - name: Chromium for actual HWP HWPX font UI E2E
        run: npx --prefix browser-local playwright install --with-deps chromium
      - name: Download pinned public HWP/HWPX examples
        run: |
          set -euo pipefail
          mkdir -p r29-browser-fixtures
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/re-01-hangul-only-hancom.hwp' -o r29-browser-fixtures/genuine.hwp
          curl -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/tac-host-spacing.hwpx' -o r29-browser-fixtures/genuine.hwpx
      - name: Start isolated local Worker with telemetry handler (NO DEPLOY)
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > /tmp/dev26-pcfont-worker.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/local/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dev26-pcfont-worker.log
          exit 1
      - name: Actual Chromium HWP + HWPX vector conversion E2E
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/e2e.mjs
      - name: Chromium real HWP PDF embedded-font per-file audit UI
        env:
          SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
        run: node browser-local/tests/r66-pc-font-audit-browser.mjs
      - name: Confirm no production deployment
        run: echo DEV26_PC_FONT_EMBED_AUDIT_PASS_NO_DEPLOY
