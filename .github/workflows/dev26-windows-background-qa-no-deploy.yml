name: DEV26 Windows Chrome Edge background/minimize QA (NO DEPLOY)
# second run: correct deterministic elapsed/ETA test fixture, no production deploy
on:
  push:
    branches:
      - dev/dev26-final-integrated-source-20261112
    paths:
      - .github/workflows/dev26-windows-background-qa-no-deploy.yml
permissions:
  contents: read
jobs:
  windows-chrome-edge:
    runs-on: windows-2025
    timeout-minutes: 38
    env:
      CI: 'true'
      SUNRISE_TEST_URL: http://127.0.0.1:8787/local/
    steps:
      - name: Checkout development source without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 24 with cached project dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-local/package-lock.json
      - name: Pinned dependencies
        shell: pwsh
        run: npm --prefix browser-local ci --no-audit --no-fund --ignore-scripts
      - name: Targeted Windows lifecycle, cancellation, old background and queue
        shell: pwsh
        run: |
          node --test browser-local/tests/r66-windows-lifecycle.mjs browser-local/tests/conversion-clock.mjs browser-local/tests/batch.mjs browser-local/tests/r66-background-font.mjs browser-local/tests/r66-pdf-stream-diagnostics.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Vite WASM and Worker static code without deployment
        shell: pwsh
        run: |
          npm --prefix browser-local run check:source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix browser-local run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix browser-local run verify:dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-browser-build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-worker-assets.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows runner installed Chrome and Edge versions
        shell: pwsh
        run: |
          $chrome='C:\Program Files\Google\Chrome\Application\chrome.exe'
          $edge='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (!(Test-Path $chrome)) { throw 'REAL_GOOGLE_CHROME_NOT_FOUND' }
          if (!(Test-Path $edge)) { throw 'REAL_MICROSOFT_EDGE_NOT_FOUND' }
          & $chrome --version
          & $edge --version
      - name: Download pinned public HWP and HWPX fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force r29-browser-fixtures | Out-Null
          curl.exe -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/re-01-hangul-only-hancom.hwp' -o r29-browser-fixtures/genuine.hwp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl.exe -fLSs --retry 3 'https://raw.githubusercontent.com/edwardkim/rhwp/v0.8.7/samples/tac-host-spacing.hwpx' -o r29-browser-fixtures/genuine.hwpx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start isolated local Cloudflare Worker (NEVER DEPLOY)
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'dev26-windows-worker.log'
          $line="npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 > `"$log`" 2>&1"
          $proc=Start-Process -FilePath "cmd.exe" -ArgumentList "/c $line" -PassThru -WindowStyle Hidden
          $ready=$false
          for ($i=0; $i -lt 100; $i++) {
            try {
              $response=Invoke-WebRequest -Uri 'http://127.0.0.1:8787/local/health' -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ready=$true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (!$ready) {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            throw 'LOCAL_WORKER_STARTUP_FAILED'
          }
          Write-Host 'LOCAL_WORKER_READY_NO_DEPLOY'
      - name: Real Windows Google Chrome foreground tab switch minimize and recovery
        shell: pwsh
        env:
          SUNRISE_BROWSER_CHANNEL: chrome
        run: |
          node browser-local/tests/r66-windows-background-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Windows Microsoft Edge foreground tab switch minimize and recovery
        shell: pwsh
        env:
          SUNRISE_BROWSER_CHANNEL: msedge
        run: |
          node browser-local/tests/r66-windows-background-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: No production deploy or main merge
        shell: pwsh
        run: Write-Host 'DEV26_WINDOWS_CHROME_EDGE_QA_PASS_NO_DEPLOY'
